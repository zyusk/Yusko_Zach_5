[project]
name = "saus-digitizer"
version = "0.1.0"
description = "Assignment 5 -- Digitizing \"Dark-Table\" Data from the Statistical Abstract of the United States"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "curl_cffi>=0.7.0",
    "numpy<2",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "requests>=2.34.2",
]

[project.scripts]
saus-digitizer = "saus_digitizer:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]
